# Optional observability profile — prometheus + grafana alongside the app,
# SAME compose project/network as the main stack. Enable with:
#   docker compose -f compose.yaml -f compose.override.yaml \
#     -f compose.observability.yaml --profile observability up -d
# Loopback-only listeners, bounded retention, dedicated scrape token.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=1GB'
      - '--web.listen-address=0.0.0.0:9090'
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/scrape_token:/etc/prometheus/scrape_token:ro
    ports:
      - "127.0.0.1:9090:9090"      # loopback only
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
